[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcrash"
version = "0.1.0"
description = "A deterministic business API simulator for stress-testing AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=1.2,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrash"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
